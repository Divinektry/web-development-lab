<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Labs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            text-align: center;
            padding: 50px 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-size: 36px;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 35px;
        }

        .labs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .labs a {
            display: block;
            width: 180px;
            padding: 30px 15px;
            box-sizing: border-box;
            border-radius: 15px;
            background: #263b57;
            border: 1px solid #496581;
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            transition: 0.3s;
        }

        .labs a:hover {
            background: #2563eb;
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <h1>Web Development</h1>
    <p>Лабораторийн ажлаа сонгоно уу</p>

    <div class="labs">
        <a href="./LAB01/">LAB 01</a>
        <a href="./lab02/">LAB 02</a>
        <a href="./LAB3/">LAB 03</a>
        <a href="./LAB04/">LAB 04</a>
        <a href="./LAB05/">LAB 05</a>
    </div>
</body>
</html>
